# For God so loved the world that he gave his only begotten Son,
# that whoever believes in him should not perish but have eternal life.
# John 3:16

[package]
name = "codex_lux_chirho"
version = "0.2.0"
edition = "2021"
description = "Cross-platform Bible study application - Codex of Light"
license = "GPL-2.0-or-later"
repository = "https://github.com/loveJesus/rsword-chirho"
authors = ["rsword-chirho contributors"]
keywords = ["bible", "scripture", "study", "sword"]
categories = ["gui"]

[dependencies]
# UI Framework
slint = "1.9"

# Bible Engine
rsword_chirho = "0.3.0"

# Async runtime
tokio = { version = "1.43", features = ["rt", "macros"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization (for settings, bookmarks)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Local database for notes/bookmarks
rusqlite = { version = "0.32", features = ["bundled"] }

# Directories (for config/data paths)
directories = "5.0"

# Date/time for journals
chrono = { version = "0.4", features = ["serde"] }

# Regex for OSIS parsing
regex = "1.10"

[dev-dependencies]
tempfile = "3.8"

[build-dependencies]
slint-build = "1.9"

# Fast release: no LTO, incremental compilation for quick iteration
# Usage: cargo build --profile release-fast-chirho
# First build takes ~2min, subsequent builds ~30s
[profile.release-fast-chirho]
inherits = "release"
opt-level = 2
lto = false
strip = true
incremental = true
codegen-units = 16

# Thin LTO release: balanced speed/size
# Usage: cargo build --profile release-thin-chirho
[profile.release-thin-chirho]
inherits = "release"
opt-level = 3
lto = "thin"
strip = true
codegen-units = 8

# Full release: fat LTO, smallest/fastest binary (5-10 min compile)
# Usage: cargo build --release (for App Store builds)
[profile.release]
opt-level = 3
lto = true
strip = true

# Mac App Store settings (using cargo-bundle)
# Install: cargo install cargo-bundle
# Build: cargo bundle --release
[package.metadata.bundle]
name = "Codex Lux"
identifier = "com.rsword.codexlux"
icon = ["icons/icon.icns"]
version = "0.2.0"
copyright = "2024-2025 rsword-chirho contributors"
category = "Reference"
short_description = "Cross-platform Bible study application"
long_description = """
Codex Lux Chirho is a powerful Bible study application built with Rust and Slint UI.

Features:
• Read multiple Bible translations (KJV, ESV, NASB, etc.)
• Commentary support (Matthew Henry, etc.)
• Strong's dictionary lookup
• Bookmarks, highlights, and notes
• Search across modules
• Reading plans and verse of the day
• Dark/light/sepia themes
• Cross-references and parallel view

Powered by rsword_chirho, a pure Rust port of the SWORD Bible library.
"""
osx_minimum_system_version = "10.15"
osx_frameworks = []

# For notarization (requires Apple Developer account)
# Run: xcrun notarytool submit target/release/bundle/osx/Codex\ Lux.app.zip --apple-id YOUR_APPLE_ID --team-id YOUR_TEAM_ID

# Windows settings
[package.metadata.bundle.windows]
wix = "C:\\Program Files (x86)\\WiX Toolset v3.11\\bin"

# Linux settings
[package.metadata.bundle.linux]
desktop_file = "codex_lux_chirho.desktop"
